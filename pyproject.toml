[project]
name = "muonarch"
version = "0.1.0"
description = "Muon variants x architectures - 282 course project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.9",
    "transformers==4.57.6",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "torchvision",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muonarch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
