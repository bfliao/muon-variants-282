# Study constants for mlp512 (design.md §5). Run configs are GENERATED by
# muonarch/studies.py; this file is never hashed — its values are copied into
# each generated run config (and therefore hashed there).
study: mlp512
arch: mlp
width: 512
donor: mlp128                # Phase-II study: inherits non-lr/wd values from mlp128
budget_base_steps: 3520      # 1x = one pass over 901,120 CIFAR-5m images at batch 256
budget_unit: images
batch: 256
seq_len: null
grad_clip: 1.0               # default; Phase-II runs inherit the donor's Phase-I value
router_aux_loss_coef: null
precision: fp32
schedule:
  kind: wsd
  warmup_frac_of_1x: 0.05    # FIXED for every optimizer and budget (DEVIATIONS.md #6)
  decay_frac: 0.2
eval:
  every_steps: 176
  val_small_tokens: null
  val_final: full
data:
  dataset: cifar5m
  version: cifar5m-v1-b7ab24dec8fd    # pinned from data/cifar5m/meta.json
exclude_optimizers: []       # PLAN cut-order lever: list optimizers to drop from
                             # this study's DAG (e.g. [manifold]); adamw cannot go
optimizers:
  # lr centres: LITERATURE DEFAULT, Gate-2 confirmation pending (DEVIATIONS.md #8).
  # Same centres at every width: Stage-A grid positions relative to the default
  # are identical across mlp128/mlp256/mlp512 (H4 for free).
  adamw:     {lr: 1.0e-3, wd: 0.1,  beta1: 0.9, beta2: 0.95, eps: 1.0e-8}
  muon:      {lr: 0.02,   wd: 0.01, momentum: 0.95}
  moonlight: {lr: 1.0e-3, wd: 0.1,  momentum: 0.95}  # selling point: reuses AdamW's lr
  muonall:   {lr: 0.02,   wd: 0.01, momentum: 0.95}
  manifold:  {lr: 0.1,    wd: null, momentum: 0.95,
              dual_cap: 5, tol: 1.0e-6, dual_lr: 0.01, msign_steps: 10}
