# Study constants for the MoE Qwen3 LM study (design.md §5). Run configs are
# GENERATED by muonarch/studies.py; this file is never hashed — its values are
# copied into each generated run config (and therefore hashed there).
# Dense vs MoE differ ONLY in the feed-forward block, router and aux loss
# (Clarification 6): every other value below matches configs/dense.yaml.
study: moe
arch: moe
width: null
donor: dense                 # Phase-II study: inherits non-lr/wd values from dense
budget_base_steps: 2441      # 1x = 2,441 steps x 8,192 tokens ≈ 20M tokens
budget_unit: tokens
batch: 32                    # sequences per step (32 x 256 = 8,192 tokens)
seq_len: 256
grad_clip: 1.0               # default; Phase-II runs inherit the donor's Phase-I value
router_aux_loss_coef: 0.01   # fixed for all optimizers (PLAN model-config snippet)
precision: fp32
schedule:
  kind: wsd
  warmup_frac_of_1x: 0.05    # FIXED for every optimizer and budget (DEVIATIONS.md #6)
  decay_frac: 0.2
eval:
  every_steps: 100
  val_small_tokens: 500000   # first 0.5M tokens of val.bin (Gate-0 answer 8)
  val_final: full
data:
  dataset: fineweb_edu
  version: fineweb-edu-10bt-v1-5d037df91d97   # pinned from data/fineweb/meta.json
exclude_optimizers: []       # PLAN cut-order lever: list optimizers to drop from
                             # this study's DAG (e.g. [manifold]); adamw cannot go
optimizers:
  # lr centres: LITERATURE DEFAULT, Gate-2 confirmation pending (DEVIATIONS.md #8).
  adamw:     {lr: 1.0e-3, wd: 0.1,  beta1: 0.9, beta2: 0.95, eps: 1.0e-8}
  muon:      {lr: 0.02,   wd: 0.01, momentum: 0.95}
  moonlight: {lr: 1.0e-3, wd: 0.1,  momentum: 0.95}  # selling point: reuses AdamW's lr
  muonall:   {lr: 0.02,   wd: 0.01, momentum: 0.95}
  # Lion-Muon (brain-lab-research/lion-muon @ e9077a8): lr/wd centre = Moonlight's
  # (same update scale); alpha/betas = the reference's FineWeb P=5 winner.
  # period and beta1 are FIXED; lr, wd, alpha, beta2, clip are tuned.
  lionmuon:  {lr: 1.0e-3, wd: 0.1,  alpha: 30, beta1: 0.9, beta2: 0.99, period: 5}
  manifold:  {lr: 0.1,    wd: null, momentum: 0.95,
              dual_cap: 5, tol: 1.0e-6, dual_lr: 0.01, msign_steps: 10}
